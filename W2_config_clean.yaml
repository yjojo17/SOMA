interaction_policy:
  tau_like:   0.5      # PLACEHOLDER — set from calibrate_thresholds.py
  tau_dwell:  0.5      #     "
  tau_follow: 0.5      #     "
  off_bucket_like_prob: 0.01   # human like-noise on off-interest posts (must be > 0)
  high_band_like_prob:  0.4  # p(like | HIGH tier), spent against the budget
  dwell_multiplier: [2.0, 4.0] # long-dwell range for MEDIUM/HIGH
  likes_session_cap:   7       # p90 likes/session [CSV] — hard ceiling
  likes_week_cap:      14      # binding weekly budget, ~2x median [DERIVED]
  session_like_target: 3       # ~2x p75; sampled per active session
  active_session_prob: 0.9     # ~10% of sessions like nothing [CSV median ~ 0]
  follow_week_budget:  2       # [VAULT] budget-not-probability
  follow_day_cap:      1
  carousel_depth_medium: 3     # slides for MEDIUM (HIGH = all, BASELINE = cover only)

