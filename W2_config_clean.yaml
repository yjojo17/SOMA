bucket_definitions:

  News & Politics:
    - name: news
      description: >
        A news or journalism post from a news outlet: reported headlines,
        breaking-news coverage, press photography, news articles, and
        journalistic infographics. Professionally produced news and political
        reporting.

  Fashion:
    - name: fashion
      description: >
        A fashion post: outfits and styling, clothing and streetwear, designer and
        runway looks, accessories, lookbooks, and fashion shoots. The image centers
        on what someone is wearing.

  Fitness:
    - name: fitness
      description: >
        A fitness post: workout and exercise videos, gym and weight training,
        running and cycling, fitness demonstrations and form, athletic physiques,
        and people working out. The image shows exercise or training.

  Food:
    - name: food
      description: >
        A food post: dishes, recipes, cooking and baking, restaurant meals,
        food photography, drinks and dining — the image centers on food itself.

  Pets and Animals:
    - name: pets_and_animals
      description: >
        A pet or animal post: dogs, cats and other pets, wildlife and nature,
        animal rescue and care, zoo and aquarium animals, and cute or funny animal
        clips. The image centers on an animal.

  Art:
    - name: art
      description: >
        An art post: paintings, drawings and illustration, digital art, sculpture,
        street art and murals, art process and technique, and gallery or exhibition
        works. The image shows an artwork or its making.

  Business and Finance:
    - name: business_finance
      description: >
        A business or finance post: stock and crypto charts, trading screens,
        market data and financial graphs, money and investing, entrepreneurship
        and startups, real estate, and personal finance. The image centers on
        markets, money, or business.

  Entertainment:
    - name: entertainment
      description: >
        A meme, joke, or entertainment post: image macros, reaction images,
        satire, comedy, viral clips, celebrities, TV, movies, music, gaming, 
        and sports highlights. Casual, humorous, shareable content.

  Automotive:
    - name: automotive
      description: >
        An automotive post: cars and motorcycles, new models and reviews, car
        culture and modifications, electric vehicles, motorsport racing, and
        vehicle photography. The image centers on a vehicle.

  Travel:
    - name: travel
      description: >
        A travel post: trip and vacation photos, destination and city guides,
        travel vlogs, tourism, hotels and itineraries — content about a traveler's
        journey and the places they visit.

  Family:
    - name: family
      description: >
        A family or parenting post: parenting and kids, family activities and
        vlogs, pregnancy and child development, and home and family life. The image
        shows family or children.

  Manosphere:
      - name: manosphere
        description: >
          A masculinity and dating-advice post aimed at men: pickup and seduction
          tips, redpill commentary on women and relationships, alpha male and
          high-value man talk, male self-improvement and looksmaxxing, jawline
          and face-rating. Talking-head clips and quote cards advising young men.

