services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: audit-timescaledb
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: audit
      POSTGRES_DB: audit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /home/audit/data/timescale:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  pushgateway:
    image: prom/pushgateway:latest
    container_name: audit-pushgateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:9091:9091"
    command:
      - --persistence.file=/data/pushgateway.data
      - --persistence.interval=30s
    volumes:
      - /home/yjojo/audit/data/pushgateway:/data

  prometheus:
    image: prom/prometheus:latest
    container_name: audit-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=180d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /home/audit/data/prometheus:/prometheus
    depends_on:
      - pushgateway

  grafana:
    image: grafana/grafana:latest
    container_name: audit-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - /home/audit/data/grafana:/var/lib/grafana
    depends_on:
      timescaledb:
        condition: service_healthy
